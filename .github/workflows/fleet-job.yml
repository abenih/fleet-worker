name: fleet-job

on:
  workflow_dispatch:
    inputs:
      job:
        description: "Job script to run (jobs/<job>.sh)"
        required: true
        type: choice
        options:
          - probe
        default: probe

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run job "${{ inputs.job }}"
        run: bash jobs/${{ inputs.job }}.sh
